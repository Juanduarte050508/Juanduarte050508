# Gera a cobrinha de contribuições nas cores do perfil e publica na branch "output".
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12 horas
  workflow_dispatch:          # permite rodar na mão pela aba Actions
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Juanduarte050508
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FACC15&color_dots=#161b22,#5c4408,#a16207,#eab308,#fde047

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
