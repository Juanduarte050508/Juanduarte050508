<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Juan Duarte Moura — Software Engineering, AI e Visão Computacional">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.6" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#2a1d04"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FACC15" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FACC15" stop-opacity="1"/>
      <stop offset="1" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- ondas -->
  <path fill="#B45309" fill-opacity="0.35" d="M0 235 Q300 185 600 235 T1200 235 T1800 235 T2400 235 V300 H0 Z">
    <animateTransform attributeName="transform" type="translate" values="0 0;-1200 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path fill="#F59E0B" fill-opacity="0.45" d="M0 255 Q200 220 400 255 T800 255 T1200 255 T1600 255 T2000 255 V300 H0 Z">
    <animateTransform attributeName="transform" type="translate" values="-800 0;0 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path fill="#FACC15" fill-opacity="0.85" d="M0 275 Q150 255 300 275 T600 275 T900 275 T1200 275 T1500 275 T1800 275 V300 H0 Z">
    <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- texto -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    <text x="600" y="92" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" letter-spacing="6" fill="#FACC15">SOFTWARE ENGINEERING STUDENT</text>
    <text x="600" y="158" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="url(#gold)">JUAN DUARTE MOURA</text>
    <rect x="400" y="180" width="400" height="2" fill="url(#line)"/>
    <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#c9d1d9">AI &amp; Computer Vision  ·  Full-Stack  ·  From Mechatronics to Code</text>
  </g>
</svg>
