<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Juan Duarte Moura — visor de câmera detectando: estudante de Engenharia de Software, Python, Visão Computacional e Hardware">
  <defs>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#161618"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5121B"/>
      <stop offset="1" stop-color="#FF3B47"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B47" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF3B47" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="340" fill="url(#vignette)"/>

  <!-- grade de terços -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="0" y1="113" x2="1200" y2="113"/>
    <line x1="0" y1="227" x2="1200" y2="227"/>
  </g>

  <!-- cantos do visor -->
  <g stroke="#ECECEE" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30 70 V30 H70"/>
    <path d="M1130 30 H1170 V70"/>
    <path d="M30 270 V310 H70"/>
    <path d="M1130 310 H1170 V270"/>
  </g>

  <!-- HUD superior -->
  <circle cx="98" cy="50" r="8" fill="#FF3B30">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="114" y="57" font-family="'Courier New', Consolas, monospace" font-size="18" font-weight="700" fill="#ECECEE">REC</text>
  <text x="175" y="57" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#8B8B93">00:20:26:00</text>
  <text x="1100" y="57" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#8B8B93">SP · BR · 4K · 60fps</text>

  <!-- caixa de detecção -->
  <g>
    <rect x="80" y="105" width="640" height="150" fill="none" stroke="url(#warm)" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="81" width="280" height="26" fill="url(#warm)"/>
    <text x="90" y="100" font-family="'Courier New', Consolas, monospace" font-size="16" font-weight="700" fill="#ffffff">person: juan_duarte · 0.99</text>

    <text x="108" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#ECECEE">Juan Duarte Moura</text>
    <text x="110" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#A8A8B0">ENG. DE SOFTWARE · FIAP</text>
  </g>

  <!-- etiquetas de "detecção" (aparecem em sequência) -->
  <g font-family="'Courier New', Consolas, monospace" font-size="15">
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.075;0.112;0.93;1" dur="8s" repeatCount="indefinite"/>
    <rect x="770" y="130" width="190" height="30" fill="none" stroke="#FF3B47" stroke-width="1.5"/>
    <text x="782" y="150" fill="#FF3B47">python · 0.97</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.138;0.175;0.93;1" dur="8s" repeatCount="indefinite"/>
    <rect x="800" y="178" width="290" height="30" fill="none" stroke="#C8C8CE" stroke-width="1.5"/>
    <text x="812" y="198" fill="#C8C8CE">computer_vision · 0.95</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.200;0.238;0.93;1" dur="8s" repeatCount="indefinite"/>
    <rect x="780" y="226" width="220" height="30" fill="none" stroke="#E63946" stroke-width="1.5"/>
    <text x="792" y="246" fill="#E63946">hardware · 0.98</text>
  </g>
  </g>

  <!-- linha de varredura -->
  <g>
    <rect x="-80" y="20" width="80" height="300" fill="url(#scan)"/>
    <line x1="0" y1="20" x2="0" y2="320" stroke="#FF3B47" stroke-opacity="0.55" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1260 0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- mira de foco -->
  <g stroke="#ECECEE" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <line x1="1090" y1="140" x2="1090" y2="160"/>
    <line x1="1080" y1="150" x2="1100" y2="150"/>
    <circle cx="1090" cy="150" r="14">
      <animate attributeName="r" values="22;10;14;14" keyTimes="0;0.3;0.45;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD inferior -->
  <text x="98" y="297" font-family="'Courier New', Consolas, monospace" font-size="16" fill="#8B8B93">ISO 400 · f/1.4 · 1/120 · AWB</text>
  <text x="1100" y="297" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="16" fill="#8B8B93">● FOCUS: LOCKED</text>
</svg>
