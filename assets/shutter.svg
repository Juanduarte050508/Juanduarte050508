  <text x="600" y="190" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#8B8B93" letter-spacing="2">■ STOP  ·  OBRIGADO POR ASSISTIR ATÉ AQUI</text>
