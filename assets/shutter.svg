<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Diafragma de câmera fechando: STOP, obrigado por assistir até aqui">
  <defs>
    <clipPath id="lens"><circle cx="600" cy="85" r="62"/></clipPath>
    <radialGradient id="metal" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#121214"/></radialGradient>
    <linearGradient id="warm" x1="0.0" y1="0.0" x2="2.5" y2="2.5"><stop offset="0" stop-color="#B5121B"/><stop offset="1" stop-color="#FF3B47"/></linearGradient>
  </defs>
  <circle cx="600" cy="85" r="72" fill="none" stroke="url(#warm)" stroke-width="3"/>
  <circle cx="600" cy="85" r="80" fill="none" stroke="#FF3B47" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 6">
