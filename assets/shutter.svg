        <animateTransform attributeName="transform" type="rotate" additive="sum" values="0;55;55;0;0" keyTimes="0;0.25;0.55;0.8;1" keySplines="0.6 0 0.4 1;0 0 1 1;0.6 0 0.4 1;0 0 1 1" calcMode="spline" dur="5s" repeatCount="indefinite"/>
        <g transform="translate(-600 -85)">
      <polygon points="639.8,108.0 600.0,131.0 560.2,108.0 560.2,62.0 600.0,39.0 639.8,62.0" fill="#050505"/>
      <circle cx="588" cy="71" r="7" fill="#FF3B47" opacity="0.35"/>
      <g stroke="#FF3B47" stroke-opacity="0.75" stroke-width="2" vector-effect="non-scaling-stroke"><line vector-effect="non-scaling-stroke" x1="639.8" y1="108.0" x2="-659.2" y2="858.0"/><line vector-effect="non-scaling-stroke" x1="600.0" y1="131.0" x2="-699.0" y2="-619.0"/><line vector-effect="non-scaling-stroke" x1="560.2" y1="108.0" x2="560.2" y2="-1392.0"/><line vector-effect="non-scaling-stroke" x1="560.2" y1="62.0" x2="1859.2" y2="-688.0"/><line vector-effect="non-scaling-stroke" x1="600.0" y1="39.0" x2="1899.0" y2="789.0"/><line vector-effect="non-scaling-stroke" x1="639.8" y1="62.0" x2="639.8" y2="1562.0"/></g>

        </g>
