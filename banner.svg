<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Juan Duarte Moura - Software Engineering, AI and Computer Vision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12233f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2F81F7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- grade tecnica de fundo -->
  <g stroke="#2F81F7" stroke-opacity="0.10" stroke-width="1">
    <path d="M0 40H1000M0 90H1000M0 140H1000M0 190H1000M0 240H1000"/>
    <path d="M60 0V260M160 0V260M260 0V260M360 0V260M460 0V260M560 0V260M660 0V260M760 0V260M860 0V260M960 0V260"/>
  </g>

  <!-- onda -->
  <path d="M0 200 C 150 160, 260 250, 420 205 S 700 150, 1000 195 L1000 260 L0 260 Z" fill="#2F81F7" fill-opacity="0.13"/>
  <path d="M0 222 C 180 188, 300 262, 470 224 S 760 180, 1000 218 L1000 260 L0 260 Z" fill="#2F81F7" fill-opacity="0.22"/>

  <!-- barra de destaque -->
  <rect x="60" y="72" width="4" height="88" rx="2" fill="url(#accent)"/>

  <text x="86" y="86" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#2F81F7" letter-spacing="4">SOFTWARE ENGINEERING STUDENT</text>

  <text x="84" y="134" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="1">JUAN DUARTE MOURA</text>

  <text x="86" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">AI &amp; Computer Vision  ·  Full-Stack  ·  From Mechatronics to Code</text>

  <rect x="86" y="184" width="320" height="2" fill="url(#fade)"/>

  <!-- marca de canto -->
  <g transform="translate(872,54)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#2F81F7" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#2F81F7" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#2F81F7"/>
  </g>
</svg>
